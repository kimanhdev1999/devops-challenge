name: frontend-ci

# The artifact built here is the exact bundle that staging and production receive.
on:
  pull_request:
    paths:
      - "src/problem4/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_call:

permissions: {}

concurrency:
  group: frontend-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: src/problem4/frontend

jobs:
  build:
    name: Lint, test, build
    runs-on: codebuild-gha-ci-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/problem4/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/problem4/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Upload the release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist-${{ github.sha }}
          path: src/problem4/frontend/dist
          if-no-files-found: error
          retention-days: 14
