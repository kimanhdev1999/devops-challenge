name: _deploy-frontend

# Reusable: publish one immutable frontend release to one environment, with automatic rollback.
# source=artifact: the bundle built earlier in this run (normal release).
# source=release:  a bundle archived by a previous release (manual rollback).
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      version:
        description: Git SHA of the release
        type: string
        required: true
      source:
        type: string
        default: artifact

permissions: {}

jobs:
  deploy:
    name: Deploy frontend to ${{ inputs.environment }}
    runs-on: codebuild-gha-release-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: frontend-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      ENVIRONMENT: ${{ inputs.environment }}
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      RELEASES_BUCKET: ${{ vars.RELEASES_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: src/problem4/scripts

      - name: Fetch the bundle built in this run
        if: inputs.source == 'artifact'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist-${{ inputs.version }}
          path: dist

      - name: Assume the ${{ inputs.environment }} frontend role (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_ROLE_ARN }}
          role-session-name: gha-frontend-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fetch an archived release
        if: inputs.source == 'release'
        run: aws s3 sync "s3://${RELEASES_BUCKET}/frontend/${VERSION}/" dist/ --only-show-errors

      - name: Check the bundle is the release we expect
        run: |
          test -f dist/index.html
          test "$(jq -r .version dist/manifest.json)" = "${VERSION}"

      - name: Archive this release for rollback
        if: inputs.source == 'artifact'
        run: aws s3 sync dist "s3://${RELEASES_BUCKET}/frontend/${VERSION}/" --only-show-errors

      - name: Remember what is live now (rollback target)
        id: current
        run: echo "version=$(curl -fsS "${SITE_URL%/}/manifest.json" | jq -r .version || true)" >> "$GITHUB_OUTPUT"

      - name: Publish (assets first, then index.html, then invalidate)
        run: src/problem4/scripts/publish-frontend.sh dist

      - name: Smoke test the live site
        run: src/problem4/scripts/smoke-test-frontend.sh "${SITE_URL}" "${VERSION}"

      - name: Roll back to the previous release
        if: failure() && steps.current.outputs.version != '' && steps.current.outputs.version != inputs.version
        env:
          PREVIOUS: ${{ steps.current.outputs.version }}
        run: |
          echo "::error::release ${VERSION} failed on ${ENVIRONMENT}; restoring ${PREVIOUS}"
          aws s3 sync "s3://${RELEASES_BUCKET}/frontend/${PREVIOUS}/" previous/ --only-show-errors
          src/problem4/scripts/publish-frontend.sh previous

      - name: Summary
        if: always()
        run: |
          echo "### Frontend → ${ENVIRONMENT}: ${{ job.status }} (\`${VERSION}\`)" >> "$GITHUB_STEP_SUMMARY"
