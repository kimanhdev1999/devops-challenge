# Docker's embedded DNS. Re-resolve "api" every 10 s so a recreated api container
# (new IP) doesn't leave nginx proxying to a dead address.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    set $api http://api:3000;   # was :3001 — the API listens on 3000

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    proxy_connect_timeout 2s;
    proxy_read_timeout    10s;
    proxy_send_timeout    10s;

    location = / {
        return 200 "Welcome to the platform\n";
    }

    # nginx's own health, for the container healthcheck / load balancer
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $api;
    }

    location ~ ^/(status|ready)$ {
        access_log off;
        proxy_pass $api;
    }
}
